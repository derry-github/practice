<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生成绩管理系统 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 2rem; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">成绩管理系统</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-white me-3" th:text="'欢迎, ' + ${session.user.name} + ' (' + ${session.user.role} + ')'"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">退出登录</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 学生视图：直接显示自己的入口 -->
    <div th:if="${session.user.role == 'STUDENT'}" class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">我的个人中心</h5>
                    <p class="card-text">您可以查询自己的成绩或修改个人基本信息。</p>
                    <a th:href="@{'/student/' + ${session.user.studentId}}" class="btn btn-primary">查看我的成绩单</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理员视图 -->
    <div th:if="${session.user.role == 'ADMIN'}" class="row">
        <!-- 管理员：加学生 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">注册新学生</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/addStudent}" method="post">
                        <div class="mb-3">
                            <label class="form-label">学号</label>
                            <input type="text" class="form-control" name="id" placeholder="例如: 2023001" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" class="form-control" name="name" placeholder="名字" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">添加学生</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 管理员：学生花名册 -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">学生列表管理</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">学号</th>
                                    <th>姓名</th>
                                    <th class="text-end pe-4">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${students}">
                                    <td class="ps-4 font-monospace" th:text="${s.studentId}"></td>
                                    <td th:text="${s.name}"></td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{'/student/' + ${s.studentId}}" class="btn btn-sm btn-outline-primary">成绩管理</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
