<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生成绩管理系统 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 2rem; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">成绩管理系统</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-white me-3" th:text="'欢迎, ' + ${session.user.name} + ' (' + ${session.user.role} + ')'"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">退出登录</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 学生视图 -->
    <div th:if="${session.user.role == 'STUDENT'}" class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card p-4">
                <div class="card-body">
                    <h5>我的个人中心</h5>
                    <p class="text-muted">查询成绩或修改基本信息</p>
                    <a th:href="@{'/student/' + ${session.user.studentId}}" class="btn btn-primary">查看我的成绩单</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理员视图 -->
    <div th:if="${session.user.role == 'ADMIN'}">
        <div class="row">
            <!-- 课程管理版块 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-white"><h6 class="mb-0">开设新课程</h6></div>
                    <div class="card-body">
                        <form th:action="@{/addCourse}" method="post">
                            <div class="mb-2"><input type="text" class="form-control form-control-sm" name="code" placeholder="课程代码" required></div>
                            <div class="mb-2"><input type="text" class="form-control form-control-sm" name="name" placeholder="课程名称" required></div>
                            <button type="submit" class="btn btn-success btn-sm w-100">添加课程</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-white"><h6 class="mb-0">课程列表</h6></div>
                    <div class="card-body p-0">
                        <table class="table table-sm mb-0">
                            <thead><tr><th class="ps-3">名称</th><th>操作</th></tr></thead>
                            <tbody>
                                <tr th:each="c : ${courses}">
                                    <td class="ps-3" th:text="${c.courseName}"></td>
                                    <td><a th:href="@{'/deleteCourse/' + ${c.courseCode}}" class="text-danger small" onclick="return confirm('确定删除课程？')">删除</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 学生管理版块 -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between">
                        <h6 class="mb-0">学生列表管理</h6>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addStudentModal">注册学生</button>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr><th class="ps-4">学号</th><th>姓名</th><th class="text-end pe-4">操作</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${students}" th:if="${s.studentId != 'admin'}">
                                    <td class="ps-4" th:text="${s.studentId}"></td>
                                    <td th:text="${s.name}"></td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{'/student/' + ${s.studentId}}" class="btn btn-sm btn-link">成绩</a>
                                        <a th:href="@{'/deleteStudent/' + ${s.studentId}}" class="btn btn-sm btn-link text-danger" onclick="return confirm('确定删除学生及所有成绩？')">删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 添加学生 Modal -->
<div class="modal fade" id="addStudentModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <form th:action="@{/addStudent}" method="post" class="modal-content">
            <div class="modal-header"><h6 class="modal-title">注册新学生</h6></div>
            <div class="modal-body">
                <div class="mb-2"><input type="text" class="form-control" name="id" placeholder="学号" required></div>
                <div class="mb-2"><input type="text" class="form-control" name="name" placeholder="姓名" required></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary btn-sm">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
