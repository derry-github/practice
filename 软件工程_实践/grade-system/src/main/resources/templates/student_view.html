<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生详情 - 学生成绩管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 2rem; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">成绩管理系统</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/">返回主页</a>
        </div>
    </div>
</nav>

<div class="container" th:if="${student != null}">
    <div th:if="${param.success}" class="alert alert-success">信息更新成功！</div>
    
    <div class="row">
        <!-- 左侧：基本信息与管理 -->
        <div class="col-md-4 mb-4">
            <!-- 基本信息卡片 -->
            <div class="card mb-4 border-primary">
                <div class="card-body">
                    <h4 class="card-title text-primary" th:text="${student.name}">学生姓名</h4>
                    <p class="text-muted mb-0">学号：<span th:text="${student.studentId}">2023000</span></p>
                    <p class="text-muted small">身份：<span th:text="${student.role == 'ADMIN' ? '管理员' : '学生'}"></span></p>
                </div>
            </div>

            <!-- 维护基本信息 (学生本人或管理员可见) -->
            <div class="card mb-4" th:if="${session.user.role == 'ADMIN' or session.user.studentId == student.studentId}">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">维护基本信息</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/updateStudent}" method="post">
                        <input type="hidden" name="id" th:value="${student.studentId}">
                        <div class="mb-3">
                            <label class="form-label">修改姓名</label>
                            <input type="text" class="form-control" name="name" th:value="${student.name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">重置密码</label>
                            <input type="password" class="form-control" name="password" placeholder="留空则不修改">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning text-white">保存修改</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 录入新成绩 (仅管理员可见) -->
            <div class="card" th:if="${session.user.role == 'ADMIN'}">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">录入新成绩</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/addGrade}" method="post">
                        <input type="hidden" name="studentId" th:value="${student.studentId}">
                        <div class="mb-3">
                            <label class="form-label">课程名称</label>
                            <input type="text" class="form-control" name="courseName" placeholder="例如：高等数学" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">分数</label>
                            <input type="number" step="0.5" class="form-control" name="score" min="0" max="100" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">提交成绩</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 右侧：成绩单表格 -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">课程成绩单</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">课程</th>
                                    <th>分数</th>
                                    <th class="text-end pe-4">评价</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="g : ${student.grades}">
                                    <td class="ps-4" th:text="${g.courseName}"></td>
                                    <td><span class="fw-bold" th:text="${g.score}"></span></td>
                                    <td class="text-end pe-4">
                                        <span class="badge" 
                                              th:classappend="${g.score >= 60 ? 'bg-success' : 'bg-danger'}"
                                              th:text="${g.score >= 60 ? '及格' : '不及格'}">
                                        </span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(student.grades)}">
                                    <td colspan="3" class="text-center py-4 text-muted">暂无成绩记录数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container text-center py-5" th:if="${student == null}">
    <div class="alert alert-warning">未找到该学生信息</div>
    <a href="/" class="btn btn-primary">返回首页</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
