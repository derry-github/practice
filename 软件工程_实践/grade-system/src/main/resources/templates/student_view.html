<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生详情 - 学生成绩管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 2rem; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">成绩管理系统</a>
        <div class="navbar-nav"><a class="nav-link active" href="/">返回主页</a></div>
    </div>
</nav>

<div class="container" th:if="${student != null}">
    <div class="row">
        <!-- 左侧：基本信息 -->
        <div class="col-md-4">
            <div class="card border-primary">
                <div class="card-body">
                    <h4 th:text="${student.name}">姓名</h4>
                    <p class="text-muted small mb-0">学号：<span th:text="${student.studentId}"></span></p>
                </div>
            </div>

            <!-- 维护基本信息 -->
            <div class="card" th:if="${session.user.role == 'ADMIN' or session.user.studentId == student.studentId}">
                <div class="card-header bg-white"><h6 class="mb-0">维护基本信息</h6></div>
                <div class="card-body">
                    <form th:action="@{/updateStudent}" method="post">
                        <input type="hidden" name="id" th:value="${student.studentId}">
                        <div class="mb-2"><input type="text" class="form-control form-control-sm" name="name" th:value="${student.name}" required></div>
                        <div class="mb-2"><input type="password" class="form-control form-control-sm" name="password" placeholder="留空则不修改密码"></div>
                        <button type="submit" class="btn btn-warning btn-sm w-100 text-white">更新信息</button>
                    </form>
                </div>
            </div>

            <!-- 录入成绩 (仅管理员) -->
            <div class="card" th:if="${session.user.role == 'ADMIN'}">
                <div class="card-header bg-white"><h6 class="mb-0">录入成绩</h6></div>
                <div class="card-body">
                    <form th:action="@{/addGrade}" method="post">
                        <input type="hidden" name="studentId" th:value="${student.studentId}">
                        <div class="mb-2">
                            <select class="form-select form-select-sm" name="courseCode" required>
                                <option value="">选择课程...</option>
                                <option th:each="c : ${allCourses}" th:value="${c.courseCode}" th:text="${c.courseName}"></option>
                            </select>
                        </div>
                        <div class="mb-2"><input type="number" step="0.5" class="form-control form-control-sm" name="score" placeholder="分数" required></div>
                        <button type="submit" class="btn btn-success btn-sm w-100">提交成绩</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 右侧：成绩列表 -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-white"><h6>课程成绩单</h6></div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr><th class="ps-4">课程名称</th><th>分数</th><th class="text-end pe-4">操作</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="g : ${student.grades}">
                                <td class="ps-4" th:text="${g.course.courseName}"></td>
                                <td>
                                    <form th:if="${session.user.role == 'ADMIN'}" th:action="@{/updateGrade}" method="post" class="d-flex gap-2">
                                        <input type="hidden" name="studentId" th:value="${student.studentId}">
                                        <input type="hidden" name="gradeId" th:value="${g.id}">
                                        <input type="number" step="0.5" class="form-control form-control-sm w-50" name="score" th:value="${g.score}">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary">改</button>
                                    </form>
                                    <span th:if="${session.user.role != 'ADMIN'}" th:text="${g.score}" class="fw-bold"></span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:if="${session.user.role == 'ADMIN'}" 
                                       th:href="@{'/deleteGrade/' + ${student.studentId} + '/' + ${g.id}}" 
                                       class="text-danger small" onclick="return confirm('删除此成绩？')">删除</a>
                                    <span th:if="${session.user.role != 'ADMIN'}" class="badge" 
                                          th:classappend="${g.score >= 60 ? 'bg-success' : 'bg-danger'}"
                                          th:text="${g.score >= 60 ? '及格' : '不及格'}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
